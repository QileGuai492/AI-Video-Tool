services:
  api:
    build: .
    container_name: ai-video-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://ai_video:change_me@postgres:5432/ai_video
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  worker:
    build: .
    container_name: ai-video-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://ai_video:change_me@postgres:5432/ai_video
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  streamlit:
    build: .
    container_name: ai-video-streamlit
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-video-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-video-postgres
    environment:
      POSTGRES_USER: ai_video
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: ai_video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: ai-video-flower
    command: celery flower --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redisdata:
  pgdata:
  uploads_data:
