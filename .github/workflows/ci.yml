name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行 Ruff
        run: ruff check app tests eval_harness scripts

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 前端安装依赖
        working-directory: frontend
        run: npm ci

      - name: 前端测试
        working-directory: frontend
        run: npm run test

      - name: 前端构建
        working-directory: frontend
        run: npm run build

      - name: 运行全部测试
        run: pytest --cov=app --cov-report=term-missing --alluredir=allure-results

      - name: 检查 gh-pages 分支
        id: check-gh-pages
        if: always()
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            mkdir -p gh-pages
          fi

      - name: 获取 Allure 历史
        if: always() && steps.check-gh-pages.outputs.exists == 'true'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: 生成 Allure 报告
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: 上传 Allure 报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report

      - name: 运行 Harness 评测（含趋势记录）
        run: python -m eval_harness --trend

      - name: 上传评测报告
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: logs/评测报告.md

      - name: 上传评测趋势历史
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-history
          path: logs/eval_history.json
