[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-tool"
version = "0.2.0"
description = "AI 视频生成工具（个人创作者版）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Personal Creator" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "celery>=5.3",
    "redis>=5.0",
    "langgraph>=0.1",
    "langchain-core>=0.1",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "oss2>=2.18",
    "moviepy>=1.0.3",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "allure-pytest>=2.13.2",
    "ruff>=0.3",
    "types-python-dateutil>=2.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/celery_app.py", "app/providers/minimax.py", "app/providers/tongyi.py", "app/providers/claude.py"]
